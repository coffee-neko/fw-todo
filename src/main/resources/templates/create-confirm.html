<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登録内容の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">登録内容の確認</h1>

        <p class="confirm-value">やること：<span th:text="${todo.title == null or todo.title.isEmpty() ? '（入力なし）' : todo.title}">（入力なし）</span></p>
        <p class="confirm-value">メモ：<span th:text="${todo.detail == null or todo.detail.isEmpty() ? '（入力なし）' : todo.detail}">（入力なし）</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category == null or todo.category.isEmpty() ? '（入力なし）' : todo.category}">（入力なし）</span></p>
        <p class="confirm-value">優先度：<span th:text="${todo.priority == null ? '（入力なし）' : todo.priority == 1 ? '高' : todo.priority == 2 ? '中' : '低'}">（入力なし）</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">（入力なし）</span></p>

        <form th:action="@{/todos}" th:object="${todo}" method="post">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">

            <div class="confirm-actions">
                <button class="btn" type="submit">登録する</button>
                <button class="btn sub" type="submit" th:formaction="@{/todos/new}">書き直す</button>
            </div>
        </form>
    </main>
</body>
</html>
