<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>削除の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">削除の確認</h1>

        <p class="confirm-value">やること：<span th:text="${todo.title == null or todo.title.isEmpty() ? '（入力なし）' : todo.title}">（入力なし）</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category == null or todo.category.isEmpty() ? '（入力なし）' : todo.category}">（入力なし）</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">（入力なし）</span></p>

        <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
            <div class="confirm-actions">
                <button class="btn" type="submit">消す</button>
                <a class="btn sub" th:href="@{/todos}">やめる</a>
            </div>
        </form>
    </main>
</body>
</html>
